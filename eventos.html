    <section id="eventos" style="background:var(--bg2);">

    <div class="container">

        <div class="sec-title">
            <h2>Eventos disponibles</h2>
            <p>
                Los locales publican eventos y los artistas pueden
                solicitar su participación.
            </p>
        </div>

        <div class="search-bar">

            <input
                type="text"
                id="q"
                placeholder="🔎 Nombre del evento"
                oninput="renderEventos()">

            <input
                type="date"
                id="fFecha"
                onchange="renderEventos()">

            <input
                type="time"
                id="fHora"
                onchange="renderEventos()">

            <select
                id="fAforo"
                onchange="renderEventos()">

                <option value="">👥 Aforo</option>
                <option value="100">Hasta 100</option>
                <option value="500">101 - 500</option>
                <option value="1000">501 - 1000</option>
                <option value="2000">Más de 1000</option>

            </select>

        </div>

        <div id="results" class="grid"></div>

    </div>

</section>
